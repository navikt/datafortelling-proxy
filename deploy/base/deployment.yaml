apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: datastory-proxy
  name: datastory-proxy
  namespace: datastories
spec:
  serviceAccountName: datastory-proxy
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: datastory-proxy
        team: nada
      name: datastory-proxy
    spec:
      containers:
      - name: datastory-proxy
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: nada-prod-6977
        - name: GCP_TEAM_PROJECT_ID
          value: nada-prod-6977
        - name: HOST
          value: storage.googleapis.com
        - name: BUCKET
          value: nada-ekstern-markedsplass-prod
        image: europe-west1-docker.pkg.dev/nav-data-images-prod/dataplattform-infra/datafortelling-proxy:2026.10.08-11.35 
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 400m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 1069
          runAsNonRoot: true
          runAsUser: 1069
          seccompProfile:
            type: RuntimeDefault
